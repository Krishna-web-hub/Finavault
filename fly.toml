# Fly.io deployment for the FinVault API + static SPA.
#
# Checked into the repo rather than generated by Fly's "Launch from GitHub"
# form so the deployment is reviewable and reproducible: the form cannot
# create the volume this app requires (see [[mounts]]), and its generated
# config is invisible until after the first deploy.
#
# One-time setup before the first `fly deploy`:
#   fly volumes create finvault_data --size 1 --region <region>
#   fly secrets set POSTGRES_DSN='postgresql://...'   # Neon, postgresql:// not postgres://
#   fly secrets set QDRANT_URL='https://xxx.cloud.qdrant.io:6333'
#   fly secrets set QDRANT_API_KEY='...'
#   fly secrets set FINVAULT_JWT_SECRET="$(openssl rand -hex 32)"
#   fly secrets set OPENROUTER_API_KEY='sk-or-v1-...'

app = "finavault"
primary_region = "bom"

[build]

[deploy]
  # Runs in a one-off machine before the new version takes traffic, as the
  # database owner. Schema DDL and RLS policy installation belong here and
  # not in the app process: see finvault/migrate.py, and the app's own
  # startup verification in api/main.py which re-checks under the runtime
  # role because a migration cannot observe the role the app connects as.
  release_command = "finvault-migrate"

[env]
  # The Dockerfile CMD binds ${PORT:-7860}. Fly does not inject PORT for
  # Dockerfile-based apps (only for buildpacks), so it is stated here and
  # must match internal_port below.
  PORT = "7860"

  # THE critical line. LocalKeyProvider mints a fresh 256-bit KEK whenever
  # this file is absent (security/encryption.py:48), and Fly machine rootfs
  # is ephemeral. Left at its .secrets/master.key default, every restart
  # would silently orphan every wrapped DEK in Postgres and Qdrant —
  # ciphertext intact, permanently unreadable. /data is the volume.
  FINVAULT_MASTER_KEY_PATH = "/data/master.key"

  # Alembic owns the schema in this deployment (release_command above), so
  # the app must not also create_all: that path can only add missing tables
  # and would mask a migration that failed to run.
  FINVAULT_AUTO_CREATE_SCHEMA = "false"

  # Tenant isolation enforced by Postgres, not only by query construction.
  # Safe to enable here because the app connects as Neon's owner role, which
  # is neither superuser nor BYPASSRLS: enable_row_level_security() sets
  # FORCE, which closes the owner exemption, so verify_isolation() at
  # startup is a real check rather than a rubber stamp.
  FINVAULT_ENABLE_RLS = "true"

[http_service]
  internal_port = 7860
  force_https = true
  auto_start_machines = true
  # "suspend" snapshots RAM instead of a cold boot, which matters here: the
  # process holds bge-small resident, so a full restart re-loads the model
  # even though the weights are baked into the image. Change to "stop" if
  # Fly declines to suspend a machine with a volume attached.
  auto_stop_machines = "suspend"
  min_machines_running = 0

  [[http_service.checks]]
    # Deliberately generous. Startup runs migrations' verification, opens
    # Postgres and Qdrant connections, and loads the embedding model before
    # /health can answer. Fly ignores the Dockerfile's HEALTHCHECK
    # directive entirely — this block is the one that decides whether a
    # slow-booting machine is killed before it ever serves.
    grace_period = "180s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "finvault_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  # Not 256MB. torch plus a resident sentence-transformers model is ~1.2-1.6GB
  # RSS; anything smaller is OOM-killed during startup, before the health
  # check above ever runs.
  memory = "2gb"
