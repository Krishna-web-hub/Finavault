{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "finvault.fullname" . }}-metrics
  labels:
    {{- include "finvault.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "finvault.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # /metrics is unauthenticated by design (see routes.metrics): a scraper
    # holding a bearer token is a credential-distribution problem, and the
    # endpoint exposes counters and latencies, never document content. The
    # access control is therefore at the network layer, here — the ingress
    # controller reaches the app for user traffic, and only the monitoring
    # namespace can reach it at all for scraping.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
{{- end }}
