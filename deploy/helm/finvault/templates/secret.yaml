{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "finvault.fullname" . }}-secrets
  labels:
    {{- include "finvault.labels" . | nindent 4 }}
  annotations:
    # Kept through an uninstall so a reinstall does not generate a new master
    # key — which would make every already-stored document undecryptable.
    # Deleting this Secret is a deliberate, destructive act; make it one.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  FINVAULT_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_OWNER_PASSWORD: {{ .Values.secrets.postgresOwnerPassword | quote }}
  FINVAULT_MASTER_KEY: {{ .Values.secrets.masterKey | quote }}
{{- end }}
