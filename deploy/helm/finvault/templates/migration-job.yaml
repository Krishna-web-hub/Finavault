{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "finvault.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "finvault.labels" . | nindent 4 }}
  annotations:
    # A pre-install/pre-upgrade hook: the schema must exist and the policies
    # must be installed *before* any pod starts, or the first request hits a
    # missing table. before-hook-creation deletes the previous revision's Job
    # so a redeploy is not blocked by a completed one still holding the name.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # Bounded retries: a migration that cannot connect will not succeed by
  # being run twenty more times, and an unbounded backoff hides the failure
  # behind a Job that looks merely slow.
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "finvault.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "finvault.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # Runs as the OWNING role, which is the only role that can create
          # tables and install policies. The application itself connects as a
          # different, non-owner role precisely so the policies apply to it —
          # see security/rls.py.
          #
          # `finvault-migrate` is a console script in the image (it applies
          # Alembic revisions to head, then installs the RLS policies) rather
          # than an inline `python -c` block, so this deployment path is code
          # that lint and tests can see instead of a string inside a template.
          # See src/finvault/migrate.py.
          command: ["finvault-migrate"]
          env:
            - name: POSTGRES_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "finvault.secretName" . }}
                  key: POSTGRES_OWNER_PASSWORD
            - name: POSTGRES_DSN
              value: "postgresql://{{ .Values.migration.owner }}:$(POSTGRES_OWNER_PASSWORD)@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
            - name: FINVAULT_ENABLE_RLS
              value: {{ .Values.config.enableRls | quote }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
